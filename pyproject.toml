[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-normalization-sensitivity"
version = "0.1.0a1"
description = "FR: Mesurer les amplifications de joints quasi constants | EN: Measure amplification of near-constant joints | ES: Medir amplificación de articulaciones casi constantes"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
joint-normalization-sensitivity = "joint_normalization_sensitivity.__main__:main"

[tool.setuptools.packages.find]
include = ["joint_normalization_sensitivity*"]
